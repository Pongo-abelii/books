name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'      # Astro 7 要求 node >= 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Content gate (frontmatter / id / links)
        run: npm run check:content

      - name: Unit tests (citation / plaintext)
        run: npm test

      - name: Type check
        run: npx astro check

      - name: Build site
        run: npm run build

      - name: Build search index (Pagefind, 中文强制分词)
        run: npx pagefind --site dist --force-language zh-cn

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
